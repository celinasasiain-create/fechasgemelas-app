services:
  - type: web
    name: fechas-gemelas-bonito
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ANTHROPIC_API_KEY
        sync: false  # cargar manualmente en el panel de Render: su clave de la API de Anthropic
